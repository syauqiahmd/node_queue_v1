# JSON access log for Grafana (shipped by Alloy). Added alongside the default access.log.
# $uri is the path WITHOUT the query string, and the referer is left out, because both can
# carry personal data (e.g. ?phoneNumber=...).
log_format observability escape=json
  '{"time":"$time_iso8601","host":"$host","method":"$request_method","path":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
  '"remote_addr":"$remote_addr","user_agent":"$http_user_agent"}';

access_log /var/log/nginx/access.json.log observability;
