sonar.projectKey=node_queue
sonar.projectName=node_queue
sonar.projectVersion=1.0.0
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/coverage/**,**/generated/**,**/dist/**,**/.git/**
sonar.test.inclusions=tests/**/*.test.js

# Ignore specific rules for tests (Hardcoded credentials, Pseudo-randomness, HTTP)
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*.js
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*.js
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=tests/**/*.js
