# Single entry point: UI static files + reverse proxy to the backend containers.
# Traffic arrives from the Kominfo reverse proxy (10.23.254.1) or the DMZ.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Scheme the visitor used: taken from the Kominfo proxy when it sends it, else ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# JSON access log for Grafana (same format as the old VPS). $uri has no query string,
# which can carry personal data (e.g. ?phoneNumber=...).
log_format observability escape=json
  '{"time":"$time_iso8601","host":"$host","method":"$request_method","path":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
  '"remote_addr":"$remote_addr","user_agent":"$http_user_agent"}';

server {
    listen 80 default_server;
    access_log /dev/stdout observability;
    # The Kominfo reverse proxy (seen as 10.23.150.254) connects over HTTPS (443).
    # Self-signed cert for that hop only; visitors get the proxy's real certificate.
    listen 443 ssl default_server;
    ssl_certificate     /etc/nginx/tls/upstream.crt;
    ssl_certificate_key /etc/nginx/tls/upstream.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;

    # Recover the real client IP from the Kominfo proxy so express-rate-limit
    # (trust proxy = 1) sees visitors, not the proxy.
    set_real_ip_from 10.23.254.1;
    set_real_ip_from 10.23.150.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 10m;
    server_tokens off;

    # Resolve container names lazily so nginx starts even if a backend container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream       http://api:8000;
    set $ws_upstream        http://websocket:8080;
    set $filer_upstream     http://seaweedfs:8888;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 120s;

    root /usr/share/nginx/html;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST API (+ socket.io, which lives on the API process)
    location /api/ {
        proxy_pass $api_upstream;
    }
    location /socket.io/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 1h;
    }

    # Websocket service health (Redis pub/sub + connected clients), for Synthetic Monitoring.
    location = /ws/health {
        set $ws_health http://websocket:8080/health;
        proxy_pass $ws_health;
    }

    # Plain WebSocket service (explicit path, e.g. VITE_WS_URL=wss://<domain>/ws)
    location /ws {
        proxy_pass $ws_upstream;
        proxy_read_timeout 1h;
    }

    # Public audio only: generated sounds are served read-only from the SeaweedFS filer.
    # Everything else in the bucket (e.g. db-backups/) is not reachable from outside.
    location /qms-media/sound-generated/ {
        limit_except GET HEAD { deny all; }
        rewrite ^/qms-media/(.*)$ /buckets/qms-media/$1 break;
        proxy_pass $filer_upstream;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=3600";
    }

    # Grafana Faro (frontend monitoring) through our own origin. An upstream proxy may add a
    # Content-Security-Policy whose connect-src only allows 'self'; the UI then sends to
    # VITE_FARO_URL=https://<domain>/faro/collect/<app-key>.
    location /faro/ {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        set $faro_upstream https://faro-collector-prod-ap-southeast-2.grafana.net;
        rewrite ^/faro/(.*)$ /$1 break;
        proxy_pass $faro_upstream;
        proxy_set_header Host faro-collector-prod-ap-southeast-2.grafana.net;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name faro-collector-prod-ap-southeast-2.grafana.net;
    }

    # Organization logos, stored in SeaweedFS (qms-media/org-logos/) and served from our own
    # origin so an upstream CSP with img-src 'self' allows them. Read-only, no directory listing.
    location = /qms-media/org-logos/ { return 404; }
    location /qms-media/org-logos/ {
        limit_except GET HEAD { deny all; }
        rewrite ^/qms-media/(.*)$ /buckets/qms-media/$1 break;
        proxy_pass $filer_upstream;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=86400";

        # the filer stores SVG as text/xml; browsers only render image/svg+xml in <img>
        location ~ \.svg$ {
            limit_except GET HEAD { deny all; }
            rewrite ^/qms-media/(.*)$ /buckets/qms-media/$1 break;
            proxy_pass $filer_upstream;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Content-Type;
            add_header Content-Type "image/svg+xml";
            add_header Cache-Control "public, max-age=86400";
        }
    }

    # Hashed build assets: cache hard
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA. A WebSocket upgrade on "/" (UI default when VITE_WS_URL is unset: ws://<origin>)
    # goes to the websocket service.
    location / {
        if ($http_upgrade = "websocket") {
            proxy_pass $ws_upstream;
        }
        try_files $uri $uri/ /index.html;
    }
}
